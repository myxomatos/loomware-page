<!DOCTYPE html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página no encontrada · Loomware</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>@font-face{font-family:'Inter';font-weight:100 900;font-display:swap;src:url('/fonts/inter-latin.woff2') format('woff2')}</style>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 48px 24px;
        box-sizing: border-box;
        font-family: 'Inter', system-ui, sans-serif;
        color: #465069;
        background: #f7f8fc;
      }
      h1 {
        margin: 0;
        font-size: clamp(72px, 18vw, 140px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        background: linear-gradient(90deg, #6338ff, #b5179e 55%, #e11d48);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h2 {
        margin: 16px 0 0;
        font-size: clamp(20px, 4vw, 28px);
        font-weight: 800;
        color: #0b1739;
      }
      p {
        max-width: 46ch;
        margin: 12px auto 0;
        line-height: 1.55;
      }
      a {
        display: inline-flex;
        margin-top: 28px;
        padding: 0 24px;
        min-height: 46px;
        align-items: center;
        border-radius: 12px;
        background: #e11d48;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <h2>Página no encontrada</h2>
      <p>La página que buscas cambió de lugar o nunca existió. Revisa la dirección o vuelve al inicio.</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
